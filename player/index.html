<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <title>Video Player</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="player-shell">
    <section class="player-card" aria-label="Premium video player">
      <header class="topbar">
        <button id="backBtn" class="icon-btn" aria-label="Go back">←</button>
        <div class="title-wrap">
          <div id="title" class="title">Video Player</div>
          <div id="meta" class="meta">Ready to play</div>
        </div>
        <button id="moreBtn" class="icon-btn" aria-label="More options">⋮</button>
      </header>

      <div id="stage" class="stage">
        <video id="video" playsinline preload="metadata"></video>
        <div id="loader" class="loader hidden"><span></span><span></span><span></span></div>
        <div id="message" class="message hidden"></div>
        <button id="bigPlay" class="big-play" aria-label="Play">▶</button>
      </div>

      <div id="controls" class="controls">
        <div class="timeline-row">
          <span id="current">00:00</span>
          <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek" />
          <span id="duration">00:00</span>
        </div>
        <div class="control-row">
          <button id="playBtn" class="control-btn play-control" aria-label="Play">▶</button>
          <button id="back10" class="control-btn wide" aria-label="Back 10 seconds">↶ 10</button>
          <button id="forward10" class="control-btn wide" aria-label="Forward 10 seconds">10 ↷</button>
          <button id="muteBtn" class="control-btn" aria-label="Mute">🔊</button>
          <button id="settingsBtn" class="control-btn" aria-label="Playback settings">⚙</button>
          <button id="pipBtn" class="control-btn" aria-label="Picture in Picture">▣</button>
          <button id="fullscreenBtn" class="control-btn" aria-label="Fullscreen">⛶</button>
        </div>
      </div>

      <div id="settingsMenu" class="popup settings-popup hidden" role="dialog" aria-label="Playback settings">
        <div class="popup-row">
          <span>Speed</span>
          <button id="speedOpen" class="popup-value">1× <span>›</span></button>
        </div>
        <div id="speedChoices" class="choice-panel hidden">
          <button data-speed="0.75">0.75×</button>
          <button data-speed="1">1×</button>
          <button data-speed="1.25">1.25×</button>
          <button data-speed="1.5">1.5×</button>
          <button data-speed="2">2×</button>
        </div>
        <div class="popup-row">
          <span>Quality</span>
          <button id="qualityOpen" class="popup-value"><span id="qualityValue">Auto</span> <span>›</span></button>
        </div>
        <div id="qualityChoices" class="choice-panel hidden"></div>
      </div>

      <div id="moreMenu" class="popup more-popup hidden" role="menu" aria-label="More options">
        <button id="attachmentBtn" class="menu-item" role="menuitem"><span>📎</span><span>Attachment</span></button>
        <a id="downloadBtn" class="menu-item" role="menuitem" href="#" target="_blank" rel="noopener"><span>⇩</span><span>Download</span></a>
        <button id="reloadBtn" class="menu-item" role="menuitem"><span>↻</span><span>Reload</span></button>
      </div>
    </section>

    <section id="details" class="details">
      <div class="badge">PREMIUM PLAYER</div>
      <h1 id="detailTitle">Video</h1>
      <div class="chips">
        <span id="qualityChip" class="chip">AUTO</span>
        <span class="chip">HTML5</span>
        <span class="chip">MOBILE READY</span>
      </div>
      <p>Custom playback controls · Quality · Download · Fullscreen · Picture-in-Picture · Speed control</p>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
