<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <title>Video Player</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="player-shell">
    <section class="player-card" aria-label="Premium video player">
      <header class="topbar">
        <button id="backBtn" class="icon-btn" aria-label="Go back">←</button>
        <div class="title-wrap">
          <div id="title" class="title">Video Player</div>
          <div id="meta" class="meta">Ready to play</div>
        </div>
        <button id="moreBtn" class="icon-btn" aria-label="More options">⋮</button>
      </header>

      <div id="stage" class="stage">
        <video id="video" playsinline preload="metadata"></video>
        <div id="loader" class="loader hidden"><span></span><span></span><span></span></div>
        <div id="message" class="message hidden"></div>
        <button id="bigPlay" class="big-play" aria-label="Play">▶</button>
      </div>

      <div id="controls" class="controls">
        <div class="timeline-row">
          <span id="current">00:00</span>
          <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek" />
          <span id="duration">00:00</span>
        </div>
        <div class="control-row">
          <button id="playBtn" class="control-btn">▶</button>
          <button id="back10" class="control-btn wide">↶ 10</button>
          <button id="forward10" class="control-btn wide">10 ↷</button>
          <button id="muteBtn" class="control-btn">🔊</button>
          <select id="speed" class="select" aria-label="Playback speed">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
          <button id="pipBtn" class="control-btn">▣</button>
          <button id="fullscreenBtn" class="control-btn">⛶</button>
        </div>
      </div>
    </section>

    <section id="details" class="details">
      <div class="badge">PREMIUM PLAYER</div>
      <h1 id="detailTitle">Video</h1>
      <div class="chips">
        <span id="qualityChip" class="chip">AUTO</span>
        <span class="chip">HTML5</span>
        <span class="chip">MOBILE READY</span>
      </div>
      <p>Custom playback controls · Fullscreen · Picture-in-Picture · Speed control</p>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
